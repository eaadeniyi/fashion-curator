<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 520" fill="none">
  <style>
    .figure-line { stroke: #2a2a2a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .zone { fill: transparent; cursor: pointer; transition: fill 0.2s; }
    .zone:hover { fill-opacity: 0.15 !important; filter: brightness(1.05); }
  </style>

  <!-- === ZONES (clickable) === -->

  <!-- zone-head (hat) -->
  <ellipse id="zone-head" data-zone="zone-head" class="zone" cx="110" cy="36" rx="26" ry="30" />

  <!-- zone-eyes (sunglasses) -->
  <rect id="zone-eyes" data-zone="zone-eyes" class="zone" x="88" y="42" width="44" height="12" rx="6" />

  <!-- zone-ears (earrings / accessories) -->
  <circle id="zone-ears" data-zone="zone-ears" class="zone" cx="84" cy="36" r="8" />

  <!-- zone-neck (scarf / necklace) -->
  <rect id="zone-neck" data-zone="zone-neck" class="zone" x="96" y="68" width="28" height="18" rx="4" />

  <!-- zone-torso (top / dress / outerwear) — wider, squarer for masculine build -->
  <path id="zone-torso" data-zone="zone-torso" class="zone"
    d="M68 92 Q50 100 50 140 L54 200 Q76 214 110 216 Q144 214 166 200 L170 140 Q170 100 152 92 Q134 84 110 84 Q86 84 68 92Z" />

  <!-- zone-waist (belt) -->
  <rect id="zone-waist" data-zone="zone-waist" class="zone" x="62" y="208" width="96" height="16" rx="4" />

  <!-- zone-wrist-left (watch) -->
  <rect id="zone-wrist" data-zone="zone-wrist" class="zone" x="38" y="200" width="16" height="12" rx="3" />

  <!-- zone-hand (bag) -->
  <path id="zone-hand" data-zone="zone-hand" class="zone"
    d="M168 200 Q178 220 176 248 Q168 260 158 250 L156 216 Z" />

  <!-- zone-legs (bottom / trousers) — straighter cut for masculine -->
  <path id="zone-legs" data-zone="zone-legs" class="zone"
    d="M62 224 Q58 270 58 330 L62 390 L96 390 L110 340 L124 390 L158 390 L162 330 Q162 270 158 224 Z" />

  <!-- zone-feet (shoes / socks) -->
  <path id="zone-feet" data-zone="zone-feet" class="zone"
    d="M58 392 Q54 410 56 428 Q60 440 80 440 Q96 440 100 428 L100 392 Z
       M120 392 L120 428 Q124 440 140 440 Q160 440 164 428 Q166 410 162 392 Z" />

  <!-- === LINE ART === -->

  <!-- Head — slightly squarer for masculine -->
  <path class="figure-line" fill="none" d="M84 10 Q86 6 110 6 Q134 6 136 10 L140 20 Q144 50 136 66 Q124 76 110 76 Q96 76 84 66 Q76 50 80 20 Z" />

  <!-- Ears -->
  <path class="figure-line" fill="none" d="M80 28 Q76 36 78 46 Q82 54 84 50" />
  <path class="figure-line" fill="none" d="M140 28 Q144 36 142 46 Q138 54 136 50" />

  <!-- Short hair (close crop) -->
  <path class="figure-line" fill="none" d="M84 10 Q86 6 110 6 Q134 6 136 10" />
  <path class="figure-line" fill="none" d="M84 10 Q80 14 80 20" />
  <path class="figure-line" fill="none" d="M136 10 Q140 14 140 20" />

  <!-- Face -->
  <!-- Eyes -->
  <ellipse class="figure-line" cx="98" cy="38" rx="6" ry="4" />
  <ellipse class="figure-line" cx="122" cy="38" rx="6" ry="4" />
  <circle fill="#2a2a2a" cx="98" cy="38" r="2" />
  <circle fill="#2a2a2a" cx="122" cy="38" r="2" />
  <!-- Eyebrows — straight/thicker for masculine -->
  <line class="figure-line" x1="90" y1="31" x2="106" y2="31" />
  <line class="figure-line" x1="114" y1="31" x2="130" y2="31" />
  <!-- Nose — stronger bridge -->
  <path class="figure-line" fill="none" d="M108 44 L106 52 Q110 56 114 52 L112 44" />
  <!-- Lips — thinner -->
  <path class="figure-line" fill="none" d="M102 60 Q110 63 118 60" />
  <line class="figure-line" x1="102" y1="60" x2="118" y2="60" />
  <!-- Jaw line — squarer -->
  <path class="figure-line" fill="none" d="M84 50 Q82 60 84 68 Q96 76 110 76 Q124 76 136 68 Q138 60 136 50" />

  <!-- Neck — wider and straighter -->
  <line class="figure-line" x1="100" y1="76" x2="98" y2="90" />
  <line class="figure-line" x1="120" y1="76" x2="122" y2="90" />

  <!-- Broader shoulders -->
  <path class="figure-line" fill="none" d="M98 88 Q74 88 52 100 Q46 112 48 136" />
  <path class="figure-line" fill="none" d="M122 88 Q146 88 168 100 Q174 112 172 136" />

  <!-- Torso — rectangular masculine build -->
  <path class="figure-line" fill="none" d="M48 136 Q48 170 52 210 Q74 218 110 218 Q146 218 168 210 Q172 170 172 136" />
  <!-- Chest suggestion -->
  <path class="figure-line" fill="none" d="M70 116 Q110 122 150 116" />

  <!-- Arms — thicker -->
  <!-- Left arm -->
  <path class="figure-line" fill="none" d="M50 104 Q36 130 36 170 Q34 192 40 214 Q46 222 54 218" />
  <!-- Left hand -->
  <path class="figure-line" fill="none" d="M40 216 Q36 228 40 240 Q46 248 54 242 Q60 236 58 224 L54 218" />
  <!-- Right arm -->
  <path class="figure-line" fill="none" d="M170 104 Q184 130 184 170 Q186 192 180 214 Q174 222 166 218" />
  <!-- Right hand + bag -->
  <path class="figure-line" fill="none" d="M178 216 Q186 228 184 248 Q178 258 168 252 Q160 244 162 230 L166 218" />
  <path class="figure-line" fill="none" d="M162 232 Q176 232 176 248 Q176 260 162 260 Q148 260 148 248 Q148 232 162 232" />

  <!-- Belt line -->
  <path class="figure-line" fill="none" d="M62 210 Q110 216 158 210" />
  <rect class="figure-line" x="104" y="208" width="12" height="10" rx="2" fill="none" />

  <!-- Legs — straight masculine cut -->
  <!-- Left leg outer -->
  <path class="figure-line" fill="none" d="M62 226 Q58 270 58 330 Q58 360 62 392" />
  <!-- Left leg inner -->
  <path class="figure-line" fill="none" d="M100 226 Q102 270 104 330 Q106 360 102 392" />
  <!-- Right leg inner -->
  <path class="figure-line" fill="none" d="M120 226 Q118 270 116 330 Q114 360 118 392" />
  <!-- Right leg outer -->
  <path class="figure-line" fill="none" d="M158 226 Q162 270 162 330 Q162 360 158 392" />
  <!-- Crotch line -->
  <path class="figure-line" fill="none" d="M100 226 Q110 234 120 226" />
  <!-- Knee -->
  <ellipse class="figure-line" cx="80" cy="318" rx="12" ry="7" />
  <ellipse class="figure-line" cx="140" cy="318" rx="12" ry="7" />

  <!-- Feet / shoes — chunkier masculine -->
  <!-- Left foot -->
  <path class="figure-line" fill="none" d="M58 392 Q54 408 56 426 Q60 440 82 440 Q100 440 104 426 Q106 414 102 392" />
  <!-- Right foot -->
  <path class="figure-line" fill="none" d="M162 392 Q166 408 164 426 Q160 440 138 440 Q120 440 116 426 Q114 414 118 392" />
  <line class="figure-line" x1="56" y1="440" x2="104" y2="440" />
  <line class="figure-line" x1="116" y1="440" x2="164" y2="440" />
</svg>
